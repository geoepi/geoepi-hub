name: Validate GeoEpi Hub

on:
  pull_request:
    paths:
      - "projects/**"
      - "scripts/update_hub.py"
      - "tests/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: geoepi-hub-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-hub:
    name: Validate registries and metadata
    runs-on: ubuntu-latest

    steps:
      - name: Check out Hub pull request
        uses: actions/checkout@v6

      - name: Create cross-repository read token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GEOEPI_HUB_APP_CLIENT_ID }}
          private-key: ${{ secrets.GEOEPI_HUB_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          permission-contents: read

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install YAML parser
        run: |
          python -m pip install --disable-pip-version-check "PyYAML>=6,<7"

      - name: Run Python tests
        run: |
          python -m unittest discover -s tests -v

      - name: Validate Hub without writing generated files
        env:
          GH_READ_TOKEN: ${{ steps.app-token.outputs.token }}
          STALE_DAYS: "45"
        run: |
          python scripts/update_hub.py --validate-only

      - name: Confirm generated files were not modified
        run: |
          if [[ -n "$(git status --porcelain -- generated/)" ]]; then
            git status --short -- generated/
            echo "Validation unexpectedly modified generated files."
            exit 1
          fi
